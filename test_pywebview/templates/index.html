<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiDAR Validation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#07111c;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.title{
    font-size:42px;
    font-weight:bold;
}

.title span{
    color:#4da6ff;
}

.status{
    padding:10px 18px;
    border-radius:12px;
    background:#0d1f2f;
    color:#ffcc44;
    font-size:18px;
}

.container{
    display:flex;
    gap:20px;
}

.left-panel{
    width:320px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.right-panel{
    flex:1;
}

.card{
    background:#0b1725;
    border:1px solid #17304d;
    border-radius:15px;
    padding:18px;
}

.card-title{
    font-size:24px;
    margin-bottom:15px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    margin:14px 0;
    font-size:19px;
}

.info-value{
    color:#4da6ff;
}

button{
    width:100%;
    height:58px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
}

#startBtn{
    background:#00aa44;
}

#stopBtn{
    background:#cc3333;
}

#clearBtn{
    background:#4444cc;
}

.map-container{
    background:#06101a;
    border:1px solid #17304d;
    border-radius:15px;
    padding:15px;
}

.map-title{
    font-size:28px;
    margin-bottom:12px;
}

.map-description{
    color:#9eb2c8;
    margin-bottom:12px;
}

#lidarCanvas{
    display:block;
    width:100%;
    height:700px;
    background:#030b14;
    border:1px solid #17304d;
    border-radius:10px;
}

.log-box{
    height:170px;
    overflow-y:auto;
    font-size:15px;
    line-height:1.6;
    color:#b8cce0;
}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        LiDAR <span>Validation</span>
    </div>

    <div class="status" id="connectionStatus">
        ● STOPPED
    </div>

</div>

<div class="container">

    <div class="left-panel">

        <div class="card">

            <div class="card-title">
                측정 정보
            </div>

            <div class="info-row">
                <span>점 개수</span>
                <span class="info-value" id="pointCount">0</span>
            </div>

            <div class="info-row">
                <span>최소 거리</span>
                <span class="info-value" id="minDistance">0 mm</span>
            </div>

            <div class="info-row">
                <span>최대 거리</span>
                <span class="info-value" id="maxDistance">0 mm</span>
            </div>

            <div class="info-row">
                <span>좌표 형식</span>
                <span class="info-value" id="coordinateType">local_mm</span>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                제어
            </div>

            <button id="startBtn">
                LiDAR 시작
            </button>

            <button id="stopBtn">
                LiDAR 정지
            </button>

            <button id="clearBtn">
                화면 초기화
            </button>

        </div>

        <div class="card">

            <div class="card-title">
                로그
            </div>

            <div class="log-box" id="logBox">
                <div>[INFO] 페이지가 열렸습니다.</div>
            </div>

        </div>

    </div>

    <div class="right-panel">

        <div class="map-container">

            <div class="map-title">
                현재 LiDAR 스캔
            </div>

            <div class="map-description">
                빨간 점은 차량 위치, 빨간 화살표는 차량 전방입니다.
            </div>

            <canvas
                id="lidarCanvas"
                width="1200"
                height="800">
            </canvas>

        </div>

    </div>

</div>

<script>

const canvas = document.getElementById("lidarCanvas");
const ctx = canvas.getContext("2d");

const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

/*
1픽셀에 8mm.
최대 3000mm 범위가 화면 내부에 들어오도록 설정.
*/
const MAP_SCALE = 8;

let latestScan = [];

function addLog(message){

    const logBox = document.getElementById("logBox");
    const line = document.createElement("div");

    line.innerText = message;

    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;

    while(logBox.children.length > 30){
        logBox.removeChild(logBox.firstChild);
    }
}

function drawGrid(){

    ctx.strokeStyle = "#16314a";
    ctx.lineWidth = 1;

    const distances = [
        500,
        1000,
        1500,
        2000,
        2500,
        3000
    ];

    for(const distance of distances){

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            distance / MAP_SCALE,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.strokeStyle = "#24445f";

    ctx.beginPath();
    ctx.moveTo(0, centerY);
    ctx.lineTo(canvas.width, centerY);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(centerX, 0);
    ctx.lineTo(centerX, canvas.height);
    ctx.stroke();
}

function drawVehicle(){

    ctx.fillStyle = "red";

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle = "red";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(centerX, centerY - 55);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(centerX, centerY - 55);
    ctx.lineTo(centerX - 8, centerY - 42);
    ctx.lineTo(centerX + 8, centerY - 42);
    ctx.closePath();
    ctx.fill();
}

function drawScan(scan){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGrid();

    ctx.fillStyle = "lime";

    for(const point of scan){

        if(!Array.isArray(point) || point.length < 2){
            continue;
        }

        const x = Number(point[0]);
        const y = Number(point[1]);

        if(!Number.isFinite(x) || !Number.isFinite(y)){
            continue;
        }

        const screenX = centerX + x / MAP_SCALE;
        const screenY = centerY - y / MAP_SCALE;

        if(
            screenX < 0 ||
            screenX >= canvas.width ||
            screenY < 0 ||
            screenY >= canvas.height
        ){
            continue;
        }

        ctx.fillRect(
            screenX,
            screenY,
            3,
            3
        );
    }

    drawVehicle();
}

async function updateStatus(){

    try{

        const response = await fetch("/api/status");

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        document.getElementById("pointCount").innerText =
            data.point_count || 0;

        document.getElementById("minDistance").innerText =
            Math.round(data.min_distance || 0) + " mm";

        document.getElementById("maxDistance").innerText =
            Math.round(data.max_distance || 0) + " mm";

        document.getElementById("coordinateType").innerText =
            data.coordinate_type || "-";

        const statusElement =
            document.getElementById("connectionStatus");

        if(data.running){

            statusElement.innerText = "● SCANNING";
            statusElement.style.color = "#3cff7a";

        }else{

            statusElement.innerText = "● STOPPED";
            statusElement.style.color = "#ffcc44";
        }

        if(Array.isArray(data.scan)){

            latestScan = data.scan;
            drawScan(latestScan);
        }

        if(data.error){
            addLog("[ERROR] " + data.error);
        }

    }catch(error){

        document.getElementById("connectionStatus").innerText =
            "● CONNECTION ERROR";

        document.getElementById("connectionStatus").style.color =
            "#ff5555";

        console.log(error);
    }
}

document.getElementById("startBtn").onclick = async () => {

    await fetch("/api/start");

    addLog("[INFO] LiDAR 스캔 시작");
};

document.getElementById("stopBtn").onclick = async () => {

    await fetch("/api/stop");

    latestScan = [];
    drawScan(latestScan);

    addLog("[INFO] LiDAR 스캔 정지");
};

document.getElementById("clearBtn").onclick = () => {

    latestScan = [];
    drawScan(latestScan);

    addLog("[INFO] 화면 초기화");
};

drawScan([]);

updateStatus();

setInterval(
    updateStatus,
    100
);

</script>

</body>
</html>
